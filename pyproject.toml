[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalloop"
version = "0.1.0"
description = "Closed-loop agentic GTM engine built on Crustdata APIs (MVP)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.22",
    "pandas>=2.2",
    "pyarrow>=15",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webhooks = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["signalloop*"]

[tool.setuptools.package-data]
signalloop = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
